name = "scanpro-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# D1 database binding. Create it with `npm run db:create`, then paste the
# returned database_id below (and into your CI secrets for deploys).
[[d1_databases]]
binding = "DB"
database_name = "scanpro"
database_id = "26e5ae97-e1ec-404f-9ee0-5658301654a7"
migrations_dir = "migrations"

# R2 bucket for backed-up PDF files. Objects are keyed by "<uid>/<docId>.pdf"
# so a user can only ever read/write their own files. Create it with
# `npx wrangler r2 bucket create scanpro-files`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "scanpro-files"

# Non-secret vars. FIREBASE_PROJECT_ID is used to validate Firebase ID tokens
# (issuer/audience). It is not a secret, but keep it accurate.
[vars]
FIREBASE_PROJECT_ID = "docscan-pro-8ebe9"
