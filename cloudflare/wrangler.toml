name = "scanpro-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# D1 database binding. Create it with `npm run db:create`, then paste the
# returned database_id below (and into your CI secrets for deploys).
[[d1_databases]]
binding = "DB"
database_name = "scanpro"
database_id = "26e5ae97-e1ec-404f-9ee0-5658301654a7"
migrations_dir = "migrations"

# KV namespace for backed-up PDF files (no card required, unlike R2). Values are
# keyed "<uid>/<docId>.pdf" so a user can only ever read/write their own files.
# NOTE: KV caps a single value at 25 MB — fine for scanned PDFs. Create it with
# `npx wrangler kv namespace create FILES`.
[[kv_namespaces]]
binding = "FILES"
id = "fefc3512df204d01bfb9ddd8008c1d0d"

# Non-secret vars. FIREBASE_PROJECT_ID is used to validate Firebase ID tokens
# (issuer/audience). It is not a secret, but keep it accurate.
[vars]
FIREBASE_PROJECT_ID = "docscan-pro-8ebe9"
